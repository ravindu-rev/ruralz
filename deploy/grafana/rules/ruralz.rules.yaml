#
# Prometheus alert rules of Ruralz Gateway (M1): the rules of
# docs/architecture/10-observability.md "Alert rules" and a page and a ticket
# burn-rate rule for every SLO objective of 90% or more ("SLO definitions").
# Histogram bounds are matched in the form Prometheus 3 stores them (le="2.0").
groups:
  - name: ruralz
    rules:
      - alert: RuralzNodeDegradedPage
        expr: ruralz_node_degraded_info{reason=~"state_store_breaker_open|upstream_panic|snapshot_ending_overdue"} == 1
        for: 5m
        labels:
          severity: page
        annotations:
          dashboard: Ruralz Gateway overview
          summary: 'Node {{ $labels.instance }} is degraded: {{ $labels.reason }}'
      - alert: RuralzNodeDegraded
        expr: ruralz_node_degraded_info{reason!~"state_store_breaker_open|upstream_panic|snapshot_ending_overdue|cleartext_hop"} == 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          dashboard: Ruralz Gateway overview
          summary: 'Node {{ $labels.instance }} is degraded: {{ $labels.reason }}'
      - alert: RuralzCleartextHop
        expr: ruralz_security_cleartext_hops{hop=~"state_store|telemetry|admin"} > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          dashboard: Node runtime and configuration
          summary: Node {{ $labels.instance }} has a cleartext {{ $labels.hop }} hop
      - alert: RuralzGatewayP50
        expr: sum(rate(ruralz_http_gateway_duration_seconds_bucket{le="0.00015"}[1h])) / sum(rate(ruralz_http_gateway_duration_seconds_count[1h])) < 0.5
        for: 30m
        labels:
          severity: ticket
        annotations:
          dashboard: SLO burn rates
          summary: 'Fewer than half of the requests spend at most 150 µs in the gateway (SLO-GW-3)'
      - alert: RuralzStateWritesDropped
        expr: rate(ruralz_state_writes_dropped_total[5m]) > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          dashboard: State Store, Rate Limits and Quotas
          summary: Node {{ $labels.instance }} drops {{ $labels.kind }} State Store writes
      - alert: RuralzSeriesFolded
        expr: delta(ruralz_telemetry_folded_label_sets[15m]) > 0
        labels:
          severity: ticket
        annotations:
          dashboard: Telemetry health
          summary: Node {{ $labels.instance }} folded new {{ $labels.instrument }} label sets into _overflow
  - name: ruralz-slo-burn-rate
    rules:
      - alert: RuralzErrorBudgetBurnPage
        expr: '(sum(rate(ruralz_http_listener_requests_total{status_class="5xx",origin="node"}[1h])) / sum(rate(ruralz_http_listener_requests_total[1h]))) > 0.007 and (sum(rate(ruralz_http_listener_requests_total{status_class="5xx",origin="node"}[5m])) / sum(rate(ruralz_http_listener_requests_total[5m]))) > 0.007'
        labels:
          severity: page
          slo: SLO-GW-1
        annotations:
          dashboard: SLO burn rates
          summary: SLO-GW-1 (Node-generated 5xx responses) burns its 30-day error budget 14 times too fast over 1h and 5m
      - alert: RuralzErrorBudgetBurnTicket
        expr: '(sum(rate(ruralz_http_listener_requests_total{status_class="5xx",origin="node"}[6h])) / sum(rate(ruralz_http_listener_requests_total[6h]))) > 0.003 and (sum(rate(ruralz_http_listener_requests_total{status_class="5xx",origin="node"}[30m])) / sum(rate(ruralz_http_listener_requests_total[30m]))) > 0.003'
        labels:
          severity: ticket
          slo: SLO-GW-1
        annotations:
          dashboard: SLO burn rates
          summary: SLO-GW-1 (Node-generated 5xx responses) burns its 30-day error budget 6 times too fast over 6h and 30m
      - alert: RuralzErrorBudgetBurnPage
        expr: '(1 - sum(rate(ruralz_http_gateway_duration_seconds_bucket{le="0.001"}[1h])) / sum(rate(ruralz_http_gateway_duration_seconds_count[1h]))) > 0.14 and (1 - sum(rate(ruralz_http_gateway_duration_seconds_bucket{le="0.001"}[5m])) / sum(rate(ruralz_http_gateway_duration_seconds_count[5m]))) > 0.14'
        labels:
          severity: page
          slo: SLO-GW-2
        annotations:
          dashboard: SLO burn rates
          summary: SLO-GW-2 (Gateway-added time within 1 ms) burns its 30-day error budget 14 times too fast over 1h and 5m
      - alert: RuralzErrorBudgetBurnTicket
        expr: '(1 - sum(rate(ruralz_http_gateway_duration_seconds_bucket{le="0.001"}[6h])) / sum(rate(ruralz_http_gateway_duration_seconds_count[6h]))) > 0.06 and (1 - sum(rate(ruralz_http_gateway_duration_seconds_bucket{le="0.001"}[30m])) / sum(rate(ruralz_http_gateway_duration_seconds_count[30m]))) > 0.06'
        labels:
          severity: ticket
          slo: SLO-GW-2
        annotations:
          dashboard: SLO burn rates
          summary: SLO-GW-2 (Gateway-added time within 1 ms) burns its 30-day error budget 6 times too fast over 6h and 30m
      - alert: RuralzErrorBudgetBurnPage
        expr: '(1 - sum(rate(ruralz_state_call_duration_seconds_bucket{op="gcra",le="0.001"}[1h])) / sum(rate(ruralz_state_call_duration_seconds_count{op="gcra"}[1h]))) > 0.14 and (1 - sum(rate(ruralz_state_call_duration_seconds_bucket{op="gcra",le="0.001"}[5m])) / sum(rate(ruralz_state_call_duration_seconds_count{op="gcra"}[5m]))) > 0.14'
        labels:
          severity: page
          slo: SLO-GW-5
        annotations:
          dashboard: SLO burn rates
          summary: SLO-GW-5 (GCRA State Store round trips within 1 ms) burns its 30-day error budget 14 times too fast over 1h and 5m
      - alert: RuralzErrorBudgetBurnTicket
        expr: '(1 - sum(rate(ruralz_state_call_duration_seconds_bucket{op="gcra",le="0.001"}[6h])) / sum(rate(ruralz_state_call_duration_seconds_count{op="gcra"}[6h]))) > 0.06 and (1 - sum(rate(ruralz_state_call_duration_seconds_bucket{op="gcra",le="0.001"}[30m])) / sum(rate(ruralz_state_call_duration_seconds_count{op="gcra"}[30m]))) > 0.06'
        labels:
          severity: ticket
          slo: SLO-GW-5
        annotations:
          dashboard: SLO burn rates
          summary: SLO-GW-5 (GCRA State Store round trips within 1 ms) burns its 30-day error budget 6 times too fast over 6h and 30m
      - alert: RuralzErrorBudgetBurnPage
        expr: '(1 - sum(rate(ruralz_config_activation_duration_seconds_bucket{stage="compile",size_class!="gt10000",le="2.0"}[1h])) / sum(rate(ruralz_config_activation_duration_seconds_count{stage="compile",size_class!="gt10000"}[1h]))) > 0.14 and (1 - sum(rate(ruralz_config_activation_duration_seconds_bucket{stage="compile",size_class!="gt10000",le="2.0"}[5m])) / sum(rate(ruralz_config_activation_duration_seconds_count{stage="compile",size_class!="gt10000"}[5m]))) > 0.14'
        labels:
          severity: page
          slo: SLO-GW-6
        annotations:
          dashboard: SLO burn rates
          summary: SLO-GW-6 (Compile of up to 10,000 Routes within 2 s) burns its 30-day error budget 14 times too fast over 1h and 5m
      - alert: RuralzErrorBudgetBurnTicket
        expr: '(1 - sum(rate(ruralz_config_activation_duration_seconds_bucket{stage="compile",size_class!="gt10000",le="2.0"}[6h])) / sum(rate(ruralz_config_activation_duration_seconds_count{stage="compile",size_class!="gt10000"}[6h]))) > 0.06 and (1 - sum(rate(ruralz_config_activation_duration_seconds_bucket{stage="compile",size_class!="gt10000",le="2.0"}[30m])) / sum(rate(ruralz_config_activation_duration_seconds_count{stage="compile",size_class!="gt10000"}[30m]))) > 0.06'
        labels:
          severity: ticket
          slo: SLO-GW-6
        annotations:
          dashboard: SLO burn rates
          summary: SLO-GW-6 (Compile of up to 10,000 Routes within 2 s) burns its 30-day error budget 6 times too fast over 6h and 30m
      - alert: RuralzErrorBudgetBurnPage
        expr: '((sum(rate(ruralz_telemetry_spans_dropped_total[1h])) + sum(rate(ruralz_telemetry_logs_dropped_total[1h]))) / (sum(rate(ruralz_telemetry_spans_total[1h])) + sum(rate(ruralz_telemetry_logs_total[1h])))) > 0.014 and ((sum(rate(ruralz_telemetry_spans_dropped_total[5m])) + sum(rate(ruralz_telemetry_logs_dropped_total[5m]))) / (sum(rate(ruralz_telemetry_spans_total[5m])) + sum(rate(ruralz_telemetry_logs_total[5m])))) > 0.014'
        labels:
          severity: page
          slo: SLO-GW-7
        annotations:
          dashboard: SLO burn rates
          summary: SLO-GW-7 (Spans and log records exported) burns its 30-day error budget 14 times too fast over 1h and 5m
      - alert: RuralzErrorBudgetBurnTicket
        expr: '((sum(rate(ruralz_telemetry_spans_dropped_total[6h])) + sum(rate(ruralz_telemetry_logs_dropped_total[6h]))) / (sum(rate(ruralz_telemetry_spans_total[6h])) + sum(rate(ruralz_telemetry_logs_total[6h])))) > 0.006 and ((sum(rate(ruralz_telemetry_spans_dropped_total[30m])) + sum(rate(ruralz_telemetry_logs_dropped_total[30m]))) / (sum(rate(ruralz_telemetry_spans_total[30m])) + sum(rate(ruralz_telemetry_logs_total[30m])))) > 0.006'
        labels:
          severity: ticket
          slo: SLO-GW-7
        annotations:
          dashboard: SLO burn rates
          summary: SLO-GW-7 (Spans and log records exported) burns its 30-day error budget 6 times too fast over 6h and 30m
