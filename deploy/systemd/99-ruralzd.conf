#
# 99-ruralzd.conf: sysctl settings of ruralzd hosts, installed as
# /etc/sysctl.d/99-ruralzd.conf and applied at boot or with
# `sysctl --system`. With tcp_migrate_req (Linux 5.14 or newer, per network
# namespace), a listener closed during a handover migrates its queued
# connections and in-progress handshakes to the new process (ADR-0015).
net.ipv4.tcp_migrate_req = 1
