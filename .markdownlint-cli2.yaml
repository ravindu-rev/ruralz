# markdownlint-cli2 configuration for the Ruralz documentation set.
# Run by scripts/verify-docs.mjs (check `markdownlint`) as:
#   npx --yes markdownlint-cli2 "docs/**/*.md" "README.md"
config:
  default: true
  # No line-length limit: tables, URLs and long sentences are normal in these docs.
  MD013: false
  # Inline HTML is not allowed; HTML comments (the <!-- alias-ok --> escape) are not elements
  # and are never flagged. "!--" is listed so the intent is explicit.
  MD033:
    allowed_elements: ["!--"]
  # Repeated headings are fine under different parents (for example "### Option A" in ADRs).
  MD024:
    siblings_only: true
  # The style guide requires both a front matter `title` and an H1 equal to it, so the front
  # matter title must not count as a second top-level heading.
  MD025:
    front_matter_title: ""
  MD041:
    front_matter_title: ""
  # Tables are allowed in any pipe spacing style ("|---|---|" as well as aligned columns).
  MD060: false
ignores:
  # Internal inputs (manifest, foundation pack, style guide, research notes, drafts, reviews)
  # are not part of the published documentation set and are not rewritten by the gate.
  - "docs/_meta/**"
  - "**/node_modules/**"
