word_count_rule: Words are counted in the Markdown body after front matter, excluding fenced code blocks (including
  mermaid) and HTML comments; table cell text counts.
machine_check_kinds:
  max_words: Body word count (per word_count_rule) is at most value.
  max_lines: Total file line count is at most value.
  required_terms: Each literal in value appears at least once in the body (case-sensitive substring). The doc-level
    required_terms field is checked the same way.
  links_to: The body contains a relative Markdown link to each repo-relative path in value.
  has_table: The H2 section named in section contains at least one Markdown table.
  min_table_rows: At least one table inside the H2 section named table_heading has at least value data rows (header
    and separator excluded).
  min_table_rows_total: Data rows summed over the tables in every H2 section listed in table_headings is at least
    value.
  no_blank_cells: No table cell is empty or whitespace-only in the H2 section(s) named by table_heading or table_headings.
  cell_values_in: 'In the H2 section(s) named by table_headings, every cell of each listed column fully matches
    allowed_pattern (columns: all_but_first means every column except the first).'
  min_h3: The H2 section named in section contains at least value H3 headings.
  min_list_items: The H2 section named in section contains at least value top-level list items or table data rows.
  min_urls_per_h3: Every H3 inside the H2 section named in section contains at least value distinct http(s) URLs.
  min_distinct_matches: The body contains at least value distinct matches of the regular expression pattern.
  covers_items: Each item in value (case-insensitive) is the text of an H2 or H3 heading or the text of a Markdown
    link.
  links_all_docs_once: Every manifest doc except ids 1 and 2 is linked exactly once, and every ADR is linked exactly
    once.
  covers_source_rows: Every value in the Feature column of the tables in source appears as a Feature cell in the
    tables under table_headings.
  summary_counts_match: Counts in the table under section equal the counts of each status value in column across
    table_headings, and totals sum.
