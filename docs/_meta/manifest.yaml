  - Pros and cons of the options
  - More information
  required_h3_under_decision_outcome:
  - Consequences
  - Confirmation
  length_words:
    min: 400
    max: 1200
  acceptance:
  - Front matter contains id, title, status, date, deciders and related, and status matches this manifest.
  - H2 headings match adr_common.outline_h2 exactly and in order, and Decision outcome contains the H3 headings
    Consequences and Confirmation.
  - Considered options lists at least two options including the chosen one, and each has pros and cons.
  - 'Decision outcome states the chosen option as ''Chosen option: ..., because ...'' and matches the foundation
    pack section 7 row for this ADR.'
  - Confirmation names a concrete verification mechanism (test, lint rule, CI gate or review checklist item).
  - The ADR is linked from docs/adr/README.md and from its owning document.
