adrs:
- id: ADR-0001
  path: docs/adr/0001-implementation-language-go.md
  title: 'Implementation language: Go with CGO_ENABLED=0 static binaries'
  status: accepted
  owning_doc: docs/engineering/01-tech-stack-and-libraries.md
  wave: 2
  mode: pipeline
  depends_on:
  - docs/_meta/foundation-pack.md
  - docs/_meta/style-guide.md
  - docs/engineering/01-tech-stack-and-libraries.md
  lenses:
  - L1
  - L2
  research: []
  decision: Go 1.26 or newer with CGO_ENABLED=0 static binaries for ruralzd, ruralz-control and ruralz; FIPS variant
    built with GOFIPS140.
- id: ADR-0002
  path: docs/adr/0002-apache-2-license-no-feature-gating.md
  title: 'License: Apache-2.0 for all components, no feature gating, DCO and Revington trademark policy'
  status: accepted
  owning_doc: docs/vision/01-vision-and-positioning.md
  wave: 2
  mode: pipeline
  depends_on:
  - docs/_meta/foundation-pack.md
  - docs/_meta/style-guide.md
  - docs/engineering/01-tech-stack-and-libraries.md
  - docs/vision/01-vision-and-positioning.md
  lenses:
  - L1
  - L2
  research:
  - docs/_meta/research/licensing-landscape.md
  decision: Every component, including Ruralz Control and Ruralz Console, is Apache-2.0 with no feature gating or
    license keys; contributions use DCO sign-off; Revington holds copyright and the Ruralz trademark under a published
    trademark policy; revenue comes only from Ruralz Cloud and support.
- id: ADR-0003
  path: docs/adr/0003-configuration-format.md
  title: 'Configuration format: YAML with JSON Schema and a Kubernetes-style resource model'
  status: accepted
  owning_doc: docs/architecture/02-configuration-model.md
  wave: 2
  mode: pipeline
  depends_on:
  - docs/_meta/foundation-pack.md
  - docs/_meta/style-guide.md
  - docs/engineering/01-tech-stack-and-libraries.md
  - docs/architecture/02-configuration-model.md
  lenses:
  - L1
  - L2
  research:
  - docs/_meta/research/tooling-and-licenses.md
  decision: YAML 1.2 validated by a published JSON Schema (draft 2020-12) using apiVersion/kind/metadata/spec resources;
    JSON accepted as a strict subset; HCL and JSON-only rejected.
- id: ADR-0004
  path: docs/adr/0004-wasm-runtime-wazero.md
  title: 'WASM runtime: wazero'
  status: accepted
  owning_doc: docs/architecture/05-wasm-plugin-system.md
  wave: 2
  mode: pipeline
  depends_on:
  - docs/_meta/foundation-pack.md
  - docs/_meta/style-guide.md
  - docs/engineering/01-tech-stack-and-libraries.md
  lenses:
  - L1
  - L2
  research:
  - docs/_meta/research/go-libraries-runtime.md
  - docs/_meta/research/tooling-and-licenses.md
  decision: Use wazero (pure Go, no CGO) as the WASM runtime for Plugins; the repository is github.com/wazero/wazero
    and the Go module path is github.com/tetratelabs/wazero.
- id: ADR-0005
  path: docs/adr/0005-plugin-abi-v1.md
  title: 'Plugin ABI v1: capability-based with Extism-style conventions, proxy-wasm adapter Planned (M4)'
  status: accepted
  owning_doc: docs/architecture/05-wasm-plugin-system.md
  wave: 2
  mode: pipeline
  depends_on:
