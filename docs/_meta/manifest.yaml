forbidden_aliases:
- pattern: (?<!State Store )(?<!Control Store )\bbackends?\b
  use: Upstream
  sense: backend as a Ruralz concept; for State Store or Control Store implementations write 'State Store backend'
    or 'driver'
- pattern: \b(?:API|KrakenD|published|public) endpoints?\b
  use: Route
  sense: endpoint in the KrakenD sense (a published API path); bare 'Endpoint' is a glossary term (an Upstream target
    address) and is not flagged
- pattern: (?<!Kubernetes )(?<!Ingress )\bcontrollers?\b
  use: Ruralz Control
  sense: controller as a name for the control plane
- pattern: \bmanagement planes?\b
  use: Ruralz Control
  sense: management plane as a name for the control plane
- pattern: (?<!Grafana )(?<!Tyk )(?<!ELK Stack )\bdashboards?\b
  use: Ruralz Console
  sense: dashboard as a name for the Ruralz web UI; Grafana dashboards and third-party product names are exempt
- pattern: \bsync protocols?\b
  use: Control Stream
  sense: name for the CP-to-DP protocol
- pattern: \bconfig(?:uration)? push protocols?\b
  use: Control Stream
  sense: name for the CP-to-DP protocol
- pattern: \bcache clusters?\b
  use: State Store
  sense: name for shared runtime state
- pattern: \b(?:wasm|webassembly) (?:extensions?|modules?)\b
  use: Plugin
  sense: extension or module as a name for a WASM Plugin; the WASM spec term 'module' inside runtime internals needs
    the escape comment
alias_match:
  case_insensitive: true
  escape_comment: <!-- alias-ok -->
lenses:
  L1:
    name: feasibility-skeptic
    prompt: 'Act as a skeptical principal engineer with deep Go and distributed-systems experience, and try to prove
      the design cannot be built as written. Challenge implementability with CGO_ENABLED=0 and the libraries fixed
      in the foundation pack: hidden coordination on the request path, unbounded memory or goroutines, lock contention,
      consistency or availability claims that contradict each other, and performance figures that are implausible
      or not tagged (target) or (hypothesis). For every blocking finding cite the section name, quote the exact
      sentence as evidence, and propose a concrete fix. When you cannot confirm that a design works, default to
      verdict `revise`.'
  L2:
    name: foundation-auditor
    prompt: Act as a pedantic auditor of consistency with docs/_meta/foundation-pack.md, docs/architecture/01-system-overview.md
      and docs/architecture/02-configuration-model.md. Check every product name, kind, YAML field, port, Filter
      Chain phase, CLI command, metric name, error code, milestone tag, glossary term, ADR reference and H2 heading
      against those sources and the manifest, and flag forbidden aliases and invented fields. For each finding cite
      the section name, quote the offending line with its line number, and give the canonical replacement. Default
      to verdict `revise` when uncertain.
  L3:
    name: acceptance-audience
    prompt: Act as the acceptance tester for this document's manifest entry and as its most demanding target reader.
      Evaluate every acceptance criterion individually and record pass or fail with a note in ac_results; check
      the exact H2 outline and order (Summary and Scope and non-goals first, Open questions last), every required
      Mermaid diagram and its caption, the length band, and that every performance or scale number carries (target)
      or (hypothesis). Judge whether the declared audience can act on the document without reading its sources,
      cite section names and quote evidence for every failure, and default to verdict `revise` when uncertain.
  L4S:
    name: security-adversary
    prompt: Act as a skilled attacker preparing a threat assessment of the design. Hunt for authentication or authorization
      bypasses, Plugin sandbox escapes, Capability over-grants, Bundle or Revision tampering, Control Stream enrollment
      and mTLS weaknesses, secret leakage outside secretRef, prompt-injection and data-residency failures on AI
      traffic, and denial-of-service paths, and confirm that deny-by-default, signing, audit, and fail-open or fail-closed
      choices are explicit and safe. For every blocking finding cite the section name, quote the evidence, describe
      the attack, and propose a mitigation. Default to verdict `revise` when uncertain.
  L4X:
    name: scale-adversary
    prompt: Act as an SRE trying to break the design at 10x and 100x load and during the loss of a Node, zone, Region,
      State Store, Ruralz Control leader or Raft quorum. Look for coordination on the request path, hidden single
      points of failure, unbounded fan-out, hot keys, reconnect storms, ignored cross-region latency, and accuracy
      or consistency bounds stated without numbers; verify that every figure is tagged (target) or (hypothesis)
      and agrees with docs/architecture/11-scalability-and-distributed-state.md and docs/architecture/12-performance-budgets-and-benchmarking.md.
      For every blocking finding cite the section name, quote the evidence, and give the failure scenario and a
      fix. Default to verdict `revise` when uncertain.
  L4C:
    name: claims-auditor
    prompt: Act as a fact-checker who assumes every external claim is wrong until it is sourced. Every statement
      about a competitor, vendor, license, release or date MUST cite a URL that appears in a file under docs/_meta/research/
      and agree with the 2026-09-23 snapshot; no Ruralz capability may be described as Supported or shipped, every
      Planned tag must name a milestone M0 to M5, and every matrix must have no blank cells and counts that sum.
      For every blocking finding cite the section name, quote the claim, and name the missing or contradicting source.
      Default to verdict `revise` when uncertain.
