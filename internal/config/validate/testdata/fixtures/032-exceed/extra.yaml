apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: big
spec:
  match:
    path: {prefix: /big}
  composition:
    mode: aggregate
    steps:
      - name: a
        upstream: orders
        path: /a
        maxBodyBytes: 600Ki
      - name: b
        upstream: orders
        path: /b
        maxBodyBytes: 600Ki
      - name: c
        upstream: orders
        path: /c
