apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: plain-http
spec:
  listeners: [http]
  match:
    path: {prefix: /split}
  upstreams:
    - name: orders
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: plain-https
spec:
  listeners: [https]
  match:
    path: {prefix: /split}
  upstreams:
    - name: inventory
