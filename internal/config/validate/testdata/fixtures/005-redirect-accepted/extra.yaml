apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: to-https
spec:
  match:
    path: {prefix: /}
    hosts: [api.shop.example]
  listeners: [http]
  redirect: {status: 301, scheme: https}
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: moved
spec:
  match:
    path: {prefix: /v1/legacy/}
  redirect: {status: 307, host: "[2001:db8::1]:8443", prefix: /v2/, query: drop}
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: renamed
spec:
  match:
    path: {exact: /old}
  redirect: {status: 302, host: "10.0.0.1:65535", path: "/a%3Fb/%2F/.../c d"}
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: defaults
spec:
  match:
    path: {exact: /defaults}
  redirect: {host: www.shop.example}
