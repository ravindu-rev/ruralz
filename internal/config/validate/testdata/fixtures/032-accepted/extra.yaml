apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: fits
spec:
  match:
    path: {prefix: /fits}
  composition:
    mode: aggregate
    steps:
      - name: a
        upstream: orders
        path: /a
        maxBodyBytes: 512Ki
      - name: b
        upstream: orders
        path: /b
      - name: c
        upstream: orders
        path: /c
