apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: cart-grpc
spec:
  match:
    hosts: ["api.shop.example"]
    grpc:
      service: shop.cart.v1.CartService   # every method of the service
  excludePolicies:
    - name: ratelimit-global            # a platform guardrail
  upstreams:
    - name: cart
  timeout: 2s
