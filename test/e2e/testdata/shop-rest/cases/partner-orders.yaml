format: ruralz.test.v1
name: partner-orders
cases:
  - name: serves the partner's API key
    request:
      method: GET
      path: /partner/v1/orders/42
      headers:
        host: api.shop.example
        # partner-acme's primary key, read at run time, never inlined
        x-api-key: {file: ./secrets/partner-key}
        # samples the trace whose ruralz.filter spans the suite checks
        traceparent: 00-5bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    expect:
      status: 200
      headers:
        content-type: application/json
        strict-transport-security: max-age=31536000
      json: {id: "42", status: shipped, partner: true}
  - name: serves a server-to-server request with an origin without CORS fields
    request:
      method: GET
      path: /partner/v1/orders/42
      headers:
        host: api.shop.example
        x-api-key: {file: ./secrets/partner-key}
        origin: https://shop.example
    expect:
      status: 200
      json: {id: "42"}
  - name: rejects a request without an API key
    request:
      method: GET
      path: /partner/v1/orders/42
      headers:
        host: api.shop.example
    expect:
      status: 401
      headers:
        content-type: application/problem+json
        www-authenticate: APIKey header="x-api-key"
      json: {status: 401, code: RZ-AUTH-001}
  - name: rejects an API key no Consumer holds
    request:
      method: GET
      path: /partner/v1/orders/42
      headers:
        host: api.shop.example
        x-api-key: {file: ./secrets/wrong-api-key}
    expect:
      status: 401
      json: {code: RZ-AUTH-002}
  - name: rejects a token, since apikey-partner replaced jwt-default
    request:
      method: GET
      path: /partner/v1/orders/42
      headers:
        host: api.shop.example
        authorization: {file: ./secrets/orders-reader}
    expect:
      status: 401
      json: {code: RZ-AUTH-001}
