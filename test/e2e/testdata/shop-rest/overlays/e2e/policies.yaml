apiVersion: ruralz/v1alpha1
kind: Policy
metadata: {name: jwt-default}
spec:
  config:
    issuers:
      - issuer: https://auth.shop.example
        jwksUrl: ${E2E_IDP_URL}/.well-known/jwks.json   # the mock IdP
---
apiVersion: ruralz/v1alpha1
kind: Policy
metadata: {name: upstream-oauth}
spec:
  config:
    tokenUrl: ${E2E_IDP_URL}/oauth2/token               # the mock IdP
