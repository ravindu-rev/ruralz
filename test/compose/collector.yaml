# Configuration of the Compose suite's OpenTelemetry Collector
# (collector.Dockerfile): the Node exports spans, metrics and logs over one
# OTLP/gRPC connection to https://otel-collector:4317, and each signal goes
# to its own file of OTLP JSON lines, one export request per line, under
# /var/lib/otelcol-out, which rest.compose.yaml mounts from the test's
# directory. The certificate and key come from the suite's test CA.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
        tls:
          cert_file: /etc/otelcol-tls/tls.crt
          key_file: /etc/otelcol-tls/tls.key

exporters:
  file/traces:
    path: /var/lib/otelcol-out/traces.jsonl
  file/metrics:
    path: /var/lib/otelcol-out/metrics.jsonl
  file/logs:
    path: /var/lib/otelcol-out/logs.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      exporters: [file/metrics]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
