# S5 on the rh-3 profile: the lab hosts by their bench.example names, which
# deploy/benchhost resolves on every host, under the secret root
# /var/lib/ruralz-bench/secrets.
apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: bench
spec:
  telemetry:
    otlp:
      tls:
        caCertificate: {secretRef: {provider: file, name: /var/lib/ruralz-bench/secrets/tls/ca.pem}}
  stateStore:
    tls:
      caCertificate: {secretRef: {provider: file, name: /var/lib/ruralz-bench/secrets/tls/ca.pem}}
    zones:                           # Valkey's host is in lab-a, the Node's RURALZ_ZONE: calls count as zone="same"
      - {host: "statestore.bench.example", zone: lab-a}
