# CR LF line endings: each CR LF is one line break, so the finding keeps
# the line and column it has with LF.
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path: {prefix: /orders}
    when: >-
      request.method == "GET" ||
      request.method == "HEAD"
  upstreams:
    - name: orders
  timout: 2s
