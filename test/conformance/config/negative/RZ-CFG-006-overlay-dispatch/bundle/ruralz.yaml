apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
---
apiVersion: ruralz/v1alpha1
kind: Policy
metadata:
  name: check
spec:
  type: validation.json-schema
  config:
    schema:
      type: object
      $patch: keep
