apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path: {prefix: /orders}
  policies:
    - name: echo-status
  upstreams:
    - name: orders
---
apiVersion: ruralz/v1alpha1
kind: Policy
metadata:
  name: echo-status
spec:
  type: headers
  config:
    response:
      set:
        - name: x-order-status
          valueExpression: string(response.body.status)
