apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
  policies:
    - name: ratelimit-global
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path: {prefix: /orders}
  upstreams:
    - name: orders
---
apiVersion: ruralz/v1alpha1
kind: Policy
metadata:
  name: ratelimit-global
spec:
  type: ratelimit
  config:
    key: '"global"'
    limits:
      - requests: 30000
        window: 1s
