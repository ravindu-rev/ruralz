apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
  policies:
    - name: ratelimit-global
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path: {prefix: /orders}
  excludePolicies:
    - name: ratelimit-global
  upstreams:
    - name: orders
---
apiVersion: ruralz/v1alpha1
kind: Policy
metadata:
  name: ratelimit-global
spec:
  type: ratelimit
  overridable: false
  config:
    key: source.ip
    limits: [{requests: 1000, window: 1s}]
