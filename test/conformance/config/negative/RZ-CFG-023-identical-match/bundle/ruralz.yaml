apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    hosts: ["api.shop.example"]
    path: {prefix: /orders}
    methods: [GET, POST]
  upstreams:
    - name: orders
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders-copy
spec:
  match:
    hosts: ["API.shop.example."]
    path: {prefix: /orders}
    methods: [POST, GET]
  upstreams:
    - name: orders
