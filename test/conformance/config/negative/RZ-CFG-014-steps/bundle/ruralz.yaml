apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: summary
spec:
  match:
    path: {prefix: /summary}
  composition:
    mode: sequential
    steps:
      - name: order
        upstream: orders
        pathExpression: '"/orders/" + string(steps.items.status)'
      - name: items
        upstream: orders
        path: /items
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: parallel
spec:
  match:
    path: {prefix: /parallel}
  composition:
    mode: aggregate
    steps:
      - name: order
        upstream: orders
        pathExpression: '"/orders/" + string(steps.order.status)'
