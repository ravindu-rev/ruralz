apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
  policies:
    - name: cors-shop
    - name: cors-portal
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path: {prefix: /orders}
  upstreams:
    - name: orders
---
apiVersion: ruralz/v1alpha1
kind: Policy
metadata:
  name: cors-shop
spec:
  type: cors
  config: {allowOrigins: ["https://shop.example"], allowMethods: [GET]}
---
apiVersion: ruralz/v1alpha1
kind: Policy
metadata:
  name: cors-portal
spec:
  type: cors
  config: {allowOrigins: ["https://portal.example"], allowMethods: [GET]}
