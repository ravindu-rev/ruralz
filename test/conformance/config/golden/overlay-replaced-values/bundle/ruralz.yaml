apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path: {prefix: /orders}
    methods: [GET, HEAD, POST]
  policies:
    - name: limit
  upstreams:
    - name: orders
  timeout: 5s
---
apiVersion: ruralz/v1alpha1
kind: Policy
metadata:
  name: limit
spec:
  type: ratelimit
  config:
    key: source.ip
    limits:
      - requests: 100
        window: 1s
      - requests: 1000
        window: 1m
