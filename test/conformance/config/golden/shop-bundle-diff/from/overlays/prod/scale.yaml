apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  retries:
    attempts: 3                         # scalar replaced; other retry fields kept
  circuitBreaker:
    consecutiveFailures: 10
---
apiVersion: ruralz/v1alpha1
kind: AIModel
metadata:
  name: support-chat
spec:
  candidates:
    - name: secondary                   # orderedMap: merged in place by name, position kept
      when: "ai.estimatedInputTokens < 50000"
