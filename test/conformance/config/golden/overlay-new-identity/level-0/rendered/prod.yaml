apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: inventory
spec:
  protocol: http
  endpoints:
    - address: "inventory.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path:
      prefix: /orders
  upstreams:
    - name: orders
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: stock
spec:
  match:
    path:
      prefix: /stock
  upstreams:
    - name: inventory
