apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
  retries:
    attempts: 3
    perTryTimeout: 1s
  timeout: 5s
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path: {prefix: /orders}
  upstreams:
    - name: orders
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders-beta
spec:
  match:
    path: {prefix: /beta/orders}
  upstreams:
    - name: orders
