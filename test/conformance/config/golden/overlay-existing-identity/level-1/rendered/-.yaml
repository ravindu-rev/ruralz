apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
  labels:
    team: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
  healthCheck:
    active:
      path: /healthz
      interval: "10s"
      timeout: "2s"
  retries:
    attempts: 2
    perTryTimeout: "1s"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path:
      prefix: /orders
  upstreams:
    - name: orders
