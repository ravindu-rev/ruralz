# The plain scalars of ADR-0003 "Confirmation": the YAML 1.2 core schema
# reads 0777 as the integer 777, raw or substituted into an integer field,
# and keeps "0777" substituted into a string field; yes, on, 0b1, 1_000
# and 2026-09-23 are strings.
apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
  labels:
    yes-word: yes
    on-word: on
    binary: 0b1
    underscore: 1_000
    date: 2026-09-23
    build: ${BUILD:-0777}
spec:
  listeners:
    - name: http
      protocol: http
      port: 0777
  policies:
    - name: limit
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path: {prefix: /orders}
  upstreams:
    - name: orders
---
apiVersion: ruralz/v1alpha1
kind: Policy
metadata:
  name: limit
spec:
  type: ratelimit
  config:
    key: source.ip
    limits:
      - requests: ${REQUESTS:-0777}
        window: 1s
