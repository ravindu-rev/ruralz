apiVersion: ruralz/v1alpha1
kind: Gateway
metadata:
  name: edge
spec:
  listeners:
    - name: http
      protocol: http
      port: 8080
    - name: internal
      protocol: http
      port: 9080
---
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders-a.shop.svc:8080"
      weight: 1
    - address: "orders-b.shop.svc:8080"
      weight: 3
    - address: "orders-c.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path:
      prefix: /orders
  upstreams:
    - name: orders
