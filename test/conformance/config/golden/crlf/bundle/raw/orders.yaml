# CR LF line endings read as LF: the folded rule holds no CR.
apiVersion: ruralz/v1alpha1
kind: Upstream
metadata:
  name: orders
spec:
  protocol: http
  endpoints:
    - address: "orders.shop.svc:8080"
---
apiVersion: ruralz/v1alpha1
kind: Route
metadata:
  name: orders
spec:
  match:
    path: {prefix: /orders}
    when: >-
      request.method == "GET" ||
      request.method == "HEAD"
  upstreams:
    - name: orders
