#
# release: the automatic release on every push to main
# (docs/engineering/04-release-versioning-and-compatibility.md, "Release
# pipeline"), with no approval step:
#   1. Version  releasekit next decides from the Conventional Commits
#               titles and footers of the non-merge commits since the
#               previous vX.Y.Z tag what the push releases: a breaking
#               change moves the minor while the major is 0 (the major
#               from 1.0.0), feat the minor, fix, perf and build(deps) the
#               patch, and the first release is 0.1.0; a Release-As: X.Y.Z
#               footer above that version raises it to X.Y.Z. When nothing
#               releases, as for docs, test, ci (Dependabot's ci(deps)
#               included), other build, chore, refactor and revert
#               commits, the run ends here, successfully.
#   2. PR       the PR pipeline, pr.yml, on the pushed commit.
#   3. Build    release-build.yml: archives, image, SBOMs, notes,
#               checksums, keyless Sigstore signatures and attestations.
#   4. Tag      the annotated, unsigned tag vX.Y.Z on the commit, pushed as
#               GitHub Actions once the build passed, so a commit whose
#               build fails leaves no tag behind; a re-run finds the tag
#               and goes on.
#   5. Publish  the GitHub Release of the release directory, whose uploaded
#               digests match SHA256SUMS, marked latest only when it is the
#               highest published release; then the image digest tagged
#               X.Y.Z and, for the newest release of its line, X.Y.
# One release runs at a time and none is cancelled: a push while a release
# runs waits, and a newer push replaces a waiting one, whose commits the
# newer run releases with its own. Only the tag and publish jobs hold
# contents: write.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# A literal group: an expression could equal a group of a called workflow,
# where github.workflow is this workflow's name, and stall the run.
concurrency:
  group: ruralz-release
  cancel-in-progress: false

# No workflow-level GOTOOLCHAIN: setup-go reads the go.mod toolchain line only
# while GOTOOLCHAIN is unset, then sets GOTOOLCHAIN=local itself.

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag and every commit since the previous release.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: next
        env:
          SHA: ${{ github.sha }}
        # The decision also goes to the run summary, so a push that releases
        # nothing says why.
        run: go run ./internal/tool/releasekit next -to "$SHA" -outputs "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  pr:
    name: pr
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/pr.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: [version, pr]
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write

  tag:
    name: Tag
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SHA: ${{ github.sha }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: next
        name: The decision again, on the tags as they are now
        run: go run ./internal/tool/releasekit next -to "$SHA" -outputs "$GITHUB_OUTPUT"
      - name: The annotated tag as GitHub Actions, unless an earlier attempt pushed it
        env:
          GH_TOKEN: ${{ github.token }}
          NOW: ${{ steps.next.outputs.version }}
          TAGGED: ${{ steps.next.outputs.tagged }}
        run: |
          # A re-run of only the failed jobs reuses the version job's
          # outputs; the tags may have moved on since.
          if [[ "$NOW" != "$VERSION" ]]; then
            echo "::error title=Release changed::the version job decided $VERSION, but the tags now give '$NOW': a later release contains $SHA, or a tag changed; re-run all jobs"
            exit 1
          fi
          if [[ "$TAGGED" == true ]]; then
            echo "$TAG already names $SHA: an earlier attempt of this run pushed it"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c tag.gpgSign=false \
            tag -a "$TAG" -m "Ruralz $VERSION" "$SHA"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.extraheader="$auth" push origin "refs/tags/$TAG"
          pushed=$(git -c http.extraheader="$auth" ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          if [[ "$pushed" != "$SHA" ]]; then
            echo "::error title=Tag not pushed::origin's $TAG names '$pushed', not $SHA"
            exit 1
          fi
          echo "created $TAG on $SHA"

  publish:
    name: Publish
    needs: [version, build, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.release-artifact }}
          path: ${{ runner.temp }}/release
      - name: The image's version tag is absent or names the digest
        run: go run ./internal/tool/releasekit tag-image -check -version "$VERSION" -digest "$DIGEST"
      - name: Draft release with every file of the release directory
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo absent)
          case "$state" in
            published)
              # Immutable: a re-run only tags the image, which must be the
              # one the published release records.
              gh release download "$TAG" --pattern release-manifest.json --dir "$RUNNER_TEMP/published"
              recorded=$(jq -r '.images[0].digest' "$RUNNER_TEMP/published/release-manifest.json")
              if [[ "$recorded" != "$DIGEST" ]]; then
                echo "::error title=Image differs::$TAG is published with the image $recorded, but this run built $DIGEST"
                exit 1
              fi
              echo "$TAG is published already: a re-run only tags the image"
              echo "PUBLISHED=true" >>"$GITHUB_ENV"
              exit 0 ;;
            draft)
              # A draft of a failed attempt: start again from the release
              # directory.
              gh release delete "$TAG" --yes ;;
          esac
          gh release create "$TAG" --draft --verify-tag --latest=false --title "Ruralz $VERSION" --notes-file "$RUNNER_TEMP/release/NOTES.md"
          gh release upload "$TAG" "$RUNNER_TEMP"/release/*
      - name: The uploaded assets match SHA256SUMS
        if: env.PUBLISHED != 'true'
        run: |
          dir="$RUNNER_TEMP/uploaded"
          gh release download "$TAG" --dir "$dir"
          cd "$dir"
          sha256sum --strict -c SHA256SUMS
          diff <(find "$RUNNER_TEMP/release" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort) <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          cmp SHA256SUMS "$RUNNER_TEMP/release/SHA256SUMS"
          cmp SHA256SUMS.sigstore.json "$RUNNER_TEMP/release/SHA256SUMS.sigstore.json"
      - name: Publish
        if: env.PUBLISHED != 'true'
        run: |
          latest=$(go run ./internal/tool/releasekit latest -version "$VERSION")
          gh release edit "$TAG" --draft=false --latest="$latest"
          echo "published $TAG (latest: $latest)"
      - name: Tag the verified image
        run: go run ./internal/tool/releasekit tag-image -version "$VERSION" -digest "$DIGEST"
