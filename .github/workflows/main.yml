#
# main: CI stage 10 on every merge to main
# (docs/engineering/02-repository-layout-and-conventions.md, "CI stages"), 45
# minutes (target). The end-to-end suite runs on the process harness with the
# secret leak assertions in every run and uploads the harness's failure
# evidence when a test fails, and the quickstart script goes from each
# ruralzd archive of a release dry run to a first proxied request on a clean
# runner of that archive's platform, without Go (SM-7,
# docs/operations/01-deployment-topologies.md, "Quickstart"). A failure does
# not block merge but blocks the next release. release.yml re-runs it on the
# tagged commit through workflow_call; main has no path filters, so `all`
# changes nothing.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Accepted for symmetry with pr-fast and pr-full; main has no path filters
        type: boolean
        default: false
  workflow_call:
    inputs:
      all:
        description: Accepted for symmetry with pr-fast and pr-full; main has no path filters
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

# No workflow-level GOTOOLCHAIN: setup-go reads the go.mod toolchain line only
# while GOTOOLCHAIN is unset, then sets GOTOOLCHAIN=local itself.

jobs:
  e2e:
    name: 10. End-to-end
    # ubuntu-24.04 keeps redis-server 7.0.15 (tech stack CI tooling row).
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install redis-server for the State Store process
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          sudo systemctl disable --now redis-server
          echo "RURALZ_TEST_REDIS_SERVER=$(command -v redis-server)" >>"$GITHUB_ENV"
          redis-server --version
      - name: End-to-end suite as root
        # Root lets the air-gapped start and the handover runs use private
        # network namespaces; the runner's Go and caches are kept. A failed
        # test leaves the harness's evidence in a directory named after it
        # under RURALZ_TEST_ARTIFACT_DIR (testing strategy, "Process
        # harness").
        env:
          RURALZ_TEST_ARTIFACT_DIR: ${{ runner.temp }}/e2e-evidence
        run: |
          sudo --preserve-env env "PATH=$PATH" "HOME=$HOME" \
            "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" make e2e
      - name: Hand the failure evidence to the runner user
        # The suite ran as root, so root owns the evidence files.
        if: failure()
        env:
          RURALZ_TEST_ARTIFACT_DIR: ${{ runner.temp }}/e2e-evidence
        run: |
          if [[ -d "$RURALZ_TEST_ARTIFACT_DIR" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$RURALZ_TEST_ARTIFACT_DIR"
          fi
      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: ${{ runner.temp }}/e2e-evidence/
          if-no-files-found: ignore
          retention-days: 14

  quickstart-archives:
    name: 10. Quickstart archives
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.split.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and history give the version and the archive timestamps.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make release-dry-run
      - name: One directory per ruralzd archive, with SHA256SUMS
        id: split
        run: |
          version=
          for p in linux_amd64 linux_arm64 darwin_arm64 darwin_amd64; do
            archives=(dist/release/ruralzd_*_"$p".tar.gz)
            if [[ ${#archives[@]} -ne 1 || ! -f ${archives[0]} ]]; then
              echo "::error::the dry run left no single ruralzd archive for $p: ${archives[*]}"
              exit 1
            fi
            name=${archives[0]##*/}
            v=${name#ruralzd_}
            version=${v%_"$p".tar.gz}
            mkdir -p "$RUNNER_TEMP/quickstart/$p"
            cp "${archives[0]}" dist/release/SHA256SUMS "$RUNNER_TEMP/quickstart/$p/"
          done
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickstart-linux-amd64
          path: ${{ runner.temp }}/quickstart/linux_amd64/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickstart-linux-arm64
          path: ${{ runner.temp }}/quickstart/linux_arm64/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickstart-darwin-arm64
          path: ${{ runner.temp }}/quickstart/darwin_arm64/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickstart-darwin-amd64
          path: ${{ runner.temp }}/quickstart/darwin_amd64/
          if-no-files-found: error
          retention-days: 7

  quickstart:
    # One clean runner per ruralzd archive: only that archive and its
    # SHA256SUMS, a sparse checkout of examples/quickstart/ and the Makefile,
    # and no go on PATH, so the script provably needs no Go. The macOS
    # runners run it with their bash 3.2 and GNU Make 3.81.
    name: 10. Quickstart ${{ matrix.os }}/${{ matrix.arch }}
    needs: quickstart-archives
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-latest}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: arm64, runner: macos-latest}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /examples/quickstart/
            /Makefile
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quickstart-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/quickstart
      - name: make quickstart without go on PATH
        env:
          RURALZ_QUICKSTART_ARCHIVE: ${{ runner.temp }}/quickstart/ruralzd_${{ needs.quickstart-archives.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
        run: |
          # Each PATH directory that holds go gives way to a directory of
          # links to its other entries, so go and gofmt leave PATH and the
          # other tools there, such as the Ubuntu runners' /usr/bin, stay.
          path='' n=0
          IFS=: read -r -a dirs <<<"$PATH"
          for d in "${dirs[@]}"; do
            if [[ -n $d && -f $d/go && -x $d/go ]]; then
              n=$((n + 1))
              links=$RUNNER_TEMP/path-$n
              mkdir "$links"
              ln -s "$d"/* "$links"/
              rm -f "$links/go" "$links/gofmt"
              echo "go leaves PATH with $d, whose other entries stay through $links"
              d=$links
            fi
            path=${path:+$path:}$d
          done
          export PATH=$path
          if command -v go; then
            echo "::error::go is still on PATH"
            exit 1
          fi
          make quickstart
