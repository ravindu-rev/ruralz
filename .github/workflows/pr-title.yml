#
# Stage 1: the pull request title becomes the squash commit subject, so it
# follows Conventional Commits. It re-runs when the title is edited.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions:
  contents: read

# No workflow-level GOTOOLCHAIN: setup-go reads the go.mod toolchain line only
# while GOTOOLCHAIN is unset, then sets GOTOOLCHAIN=local itself.

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: go run ./internal/tool/commitcheck title
      - if: github.event_name == 'merge_group'
        run: echo "The title was checked on the pull request."
